# Ganimed-Book-Printer-Start
- type: entity
  id: BookPrinterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: book printer machine board
  components:
  - type: MachineBoard
    prototype: BookPrinter
    stackRequirements:
      Capacitor: 2
      Manipulator: 2
      MatterBin: 2
# Ganimed-Book-Printer-Start

- type: entity
  parent: BaseMachineCircuitboard
  id: MachineBluespaceHarvesterCircuitboard
  name: Bluespace Harvester board
  description: A machine board for a Bluespace Harvester
  components:
  - type: Sprite
    sprite: _SpaceCats/Bluespace/module.rsi
    state: bluespace
  - type: MachineBoard
    prototype: BluespaceHarvester
    stackRequirements:
      Glass: 15
      Steel: 15
      CableHV: 5
      ArtificialBluespaceCrystal: 5
      Capacitor: 5
      MatterBin: 15
  - type: Item
    size: Normal

- type: entity
  parent: BaseMachineCircuitboard
  id: MachineBluespaceTransitorCircuitboard
  name: bluespace T.R.A.N.S.I.T.O.R board
  description: A machine board for a bluespace T.R.A.N.S.I.T.O.R
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: bluespacearray
  - type: MachineBoard
    prototype: BluespaceTransitor
    stackRequirements:
      Steel: 10
      CableHV: 30
      ArtificialBluespaceCrystal: 5
      Capacitor: 15
  - type: Item
    size: Normal
